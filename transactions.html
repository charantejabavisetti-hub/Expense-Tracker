<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Transactions - Expense Tracker</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            Expense Tracker
        </div>

        <nav>

            <a href="user-dashboard.html">
                Dashboard
            </a>

            <button
                onclick="logout()"
                class="logout-btn">
                Logout
            </button>

        </nav>

    </header>


    <!-- TRANSACTIONS -->

    <main class="dashboard">

        <h1>Transactions</h1>

        <p>
            View your income and expense transactions.
        </p>


        <section class="transactions">

            <table>

                <thead>

                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Description</th>
                    </tr>

                </thead>


                <tbody id="transactionTableBody">

                    <!-- JavaScript will add transactions here -->

                </tbody>

            </table>


            <p id="noTransactions">
                No transactions available.
            </p>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="js/dashboard.js"></script>

</body>

</html>
